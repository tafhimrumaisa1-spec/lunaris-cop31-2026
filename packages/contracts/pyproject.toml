[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunaris-contracts"
version = "0.1.0"
description = "Loader/validator for LUNARIS shared contracts (data-models.json, openapi-target.yaml)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
openapi = ["PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["lunaris_contracts*"]
