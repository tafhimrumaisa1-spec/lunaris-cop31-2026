[project]
name = "lunaris-choices"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []   # stdlib only; Pydantic/FastAPI are consumed by services/api

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
lunaris_choices = ["data/*.json"]
[tool.pytest.ini_options]
pythonpath = ["src"]
